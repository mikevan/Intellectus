<script>/**
 * Witness: the runtime. One global, `globalThis.__witness__`, that
 * instrumented files report to, and an Istanbul-shaped view of the same
 * counters at `globalThis.__coverage__` for reporters that expect it.
 *
 * What it records that Istanbul does not: for every statement, decision
 * outcome, and function entry, the id of the test that was running. The
 * hooks tell it which test that is (begin/end); the per-test record goes
 * out as one JSON line per test, the same shape the tools' other hooks
 * write, so the driver reads all of them with one reader.
 *
 * Plain CommonJS with no dependencies: it is copied into the project's
 * hooks folder (.deeptest/hooks or .untangleit/hooks) and loaded by the project's Node. It must never
 * throw into the code it is measuring.
 */
'use strict';
// One file for two places. Under Node it writes its records to disk; in a
// browser page (served by the Witness Vite plugin) there is no disk, so
// `end()` returns the record and the fixture on the Node side writes it.
const inNode = typeof process !== 'undefined' && process.versions && process.versions.node && typeof require === 'function';
const fs = inNode ? require('node:fs') : undefined;
const path = inNode ? require('node:path') : undefined;

// A process id is not unique enough. A runner that puts its workers in threads
// (Vitest can) gives each worker its own globalThis, so each loads its own copy
// of this file, while they all share one process id. Two workers would then
// append per-test lines to the same path. Node's own threadId separates them,
// is 0 on the main thread, and costs the library no knowledge of any runner.

/** Unique per worker, across processes and across threads within a process. */

  return `${process.pid}-${threadId}`;
}

const attributionDir = inNode ? process.env.WITNESS_ATTRIBUTION_DIR : undefined;
const attributionFile = attributionDir ? path.join(attributionDir, `attr-witness-${workerTag()}.jsonl`) : undefined;

const files = new Map(); // handle -> { path, cov, W }
// Files under the source root that a loader tried to instrument and could
// not: path -> reason. They are reported beside the counters, because a file
// that ran uninstrumented would otherwise look like a file that ran nothing.
const unmeasured = new Map();
let currentTest = undefined;
let hits = new Map(); // path -> Set(line) for the current test
let outcomes = new Map(); // path -> Map(branchId -> Set(index)) for the current test
let entered = new Map(); // path -> Set(fnId) for the current test

function coverageView() {
  if (!globalThis.__coverage__) {
    globalThis.__coverage__ = {};
  }
  return globalThis.__coverage__;
}

function zeros(map, branches) {
  const out = {};
  for (const id of Object.keys(map)) {
    out[id] = branches ? map[id].locations.map(() => 0) : 0;
  }
  return out;
}

function noteLine(filePath, line) {
  if (currentTest === undefined) {
    return;
  }
  let set = hits.get(filePath);
  if (!set) {
    set = new Set();
    hits.set(filePath, set);
  }
  set.add(line);
}

function noteOutcome(filePath, branchId, index) {
  if (currentTest === undefined) {
    return;
  }
  let perFile = outcomes.get(filePath);
  if (!perFile) {
    perFile = new Map();
    outcomes.set(filePath, perFile);
  }
  let set = perFile.get(branchId);
  if (!set) {
    set = new Set();
    perFile.set(branchId, set);
  }
  set.add(index);
}

function noteEntry(filePath, fnId) {
  if (currentTest === undefined) {
    return;
  }
  let set = entered.get(filePath);
  if (!set) {
    set = new Set();
    entered.set(filePath, set);
  }
  set.add(fnId);
}

function makeHandle(filePath, cov) {
  const sm = cov.statementMap;
  const bm = cov.branchMap;
  const W = {
    s(id) {
      cov.s[id] += 1;
      noteLine(filePath, sm[id].start.line);
    },
    v(id, name, value) {
      cov.s[id] += 1;
      noteLine(filePath, sm[id].start.line);
      if (typeof value === 'function' && value.name === '' && name) {
        try {
          Object.defineProperty(value, 'name', { value: name, configurable: true });
        } catch {
          // a frozen function keeps its empty name
        }
      }
      return value;
    },
    f(id) {
      cov.f[id] += 1;
      noteEntry(filePath, id);
    },
    // Every way through a decision reports here: an arm of an if or a
    // ternary, an operand of a boolean run, a default parameter value, a case
    // of a switch.
    //
    // An arm is a place control went, so the line it starts on is a line the
    // test reached and is recorded as one; a multi-line if or ternary is
    // attributed to the test that took that arm and to no other. An operand,
    // a default value, and a case label are not places, and their lines carry
    // no statement of their own, so recording them would add lines to the
    // record that are in no file's executable universe and would be dropped
    // again downstream.
    c(id, index) {
      cov.b[id][index] += 1;
      noteOutcome(filePath, id, index);
      const type = bm[id].type;
      if (type === 'if' || type === 'cond-expr') {
        noteLine(filePath, bm[id].locations[index].start.line || bm[id].line);
      }
    },
  };
  return W;
}

const witness = {
  /** Called by the loader, in the loading thread, right after instrumenting a file. */
  register(handle, filePath, maps) {
    const cov = {
      path: filePath,
      statementMap: maps.statementMap,
      fnMap: maps.fnMap,
      branchMap: maps.branchMap,
      s: zeros(maps.statementMap, false),
      f: zeros(maps.fnMap, false),
      b: zeros(maps.branchMap, true),
      // What the instrumenter decided not to count, line and reason. It rides
      // in the report so a driver can show it; Istanbul readers ignore the key.
      skipped: Array.isArray(maps.skipped) ? maps.skipped : [],
    };
    coverageView()[filePath] = cov;
    const W = makeHandle(filePath, cov);
    files.set(handle, { path: filePath, cov, W });
    return W;
  },
  /** Called by the instrumented file's prologue; with maps when the file carries its own (a browser page). */
  file(handle, maps) {
    let entry = files.get(handle);
    if (!entry && maps) {
      witness.register(handle, maps.path, maps);
      entry = files.get(handle);
    }
    if (!entry) {
      // Instrumented by a loader this process never ran: count nothing, break nothing.
      const noop = () => undefined;
      return { s: noop, f: noop, c: noop, v: (_id, _name, value) => value };
    }
    return entry.W;
  },
  /**
   * A test is starting. If one is still open, its boundary is broken: either
   * the runner interleaves tests (concurrent tests in one worker) or the
   * previous test's end never came. The open test is closed and its record
   * says so, rather than being silently overwritten, so a driver can refuse
   * to draw a card from it. Lines counted after this point belong to the
   * new test and to nothing else.
   */
  begin(testId) {
    if (currentTest !== undefined) {
      witness.end('overlapped');
    }
    currentTest = testId;
    hits = new Map();
    outcomes = new Map();
    entered = new Map();
  },
  /**
   * The current test ended: write its record (Node) or return it (browser),
   * and forget it. `boundary` is set only by a caller closing a test that
   * did not end on its own: 'overlapped' from begin(), 'unterminated' from a
   * loader at process exit. A record carrying it is evidence that the
   * attribution was cut off, never evidence about the test.
   */
  end(boundary) {
    if (currentTest === undefined) {
      return undefined;
    }
    let record;
    try {
      record = { test: currentTest, files: {}, outcomes: {}, entered: {} };
      if (boundary) {
        record.boundary = boundary;
      }
      for (const [file, lines] of hits) {
        record.files[file] = Array.from(lines).sort((a, b) => a - b);
      }
      for (const [file, perFile] of outcomes) {
        record.outcomes[file] = {};
        for (const [id, set] of perFile) {
          record.outcomes[file][id] = Array.from(set).sort((a, b) => a - b);
        }
      }
      for (const [file, set] of entered) {
        record.entered[file] = Array.from(set).sort((a, b) => a - b);
      }
      if (attributionFile) {
        fs.appendFileSync(attributionFile, `${JSON.stringify(record)}\n`);
      }
    } catch {
      // Never fail the user's tests over attribution.
    }
    currentTest = undefined;
    return record;
  },
  /** The whole-run counters as a plain object, for a fixture to carry out of a browser page. */
  snapshot() {
    return JSON.parse(JSON.stringify(coverageView()));
  },
  /** Zero every counter, so a page reused by a second test starts clean. */
  reset() {
    for (const cov of Object.values(coverageView())) {
      for (const id of Object.keys(cov.s)) {
        cov.s[id] = 0;
      }
      for (const id of Object.keys(cov.f)) {
        cov.f[id] = 0;
      }
      for (const id of Object.keys(cov.b)) {
        cov.b[id] = cov.b[id].map(() => 0);
      }
    }
    hits = new Map();
    outcomes = new Map();
    entered = new Map();
  },
  /**
   * A file under the source root that a loader could not instrument. It ran
   * as written, so its counters do not exist, and a driver that walked the
   * source tree would otherwise count it as measured and never executed.
   */
  unmeasured(filePath, reason) {
    unmeasured.set(filePath, String(reason || 'Witness could not instrument it.'));
  },
  /**
   * The whole-run counters, Istanbul's shape, written where the driver reads
   * them. The unmeasured files go beside it under the same worker tag, in a
   * file of their own, so `__coverage__` stays exactly Istanbul's shape.
   */
  writeReport(dir, name = 'coverage-final.json') {
    fs.mkdirSync(dir, { recursive: true });
    fs.writeFileSync(path.join(dir, name), JSON.stringify(coverageView()));
    if (unmeasured.size > 0) {
      const list = Array.from(unmeasured, ([file, reason]) => ({ path: file, reason }));
      fs.writeFileSync(path.join(dir, `unmeasured-${workerTag()}.json`), JSON.stringify(list));
    }
  },
  /** Unique per worker; a hook names its per-worker report with this. */
  workerTag,
  get current() {
    return currentTest;
  },
};

if (!globalThis.__witness__) {
  globalThis.__witness__ = witness;
}

if (inNode) {
  module.exports = globalThis.__witness__;
}

<script>/**
 * Witness: the boundary recorder's runtime.
 *
 * One global, `globalThis.__witnessBoundary__`, that a boundary-instrumented
 * function reports to. It records one observation per entry: the test that
 * was running, an index and a depth within that test, the arguments as they
 * arrived, and how the call ended.
 *
 * It is a separate global and a separate record file from the counters,
 * because it answers a different question and is loaded for one run of one
 * method rather than for measurement. Its only dependency on the counter
 * runtime is `__witness__.current`, the test that is running. When the
 * counter runtime is not loaded, observations carry no test identity, and
 * the gate reports insufficient evidence rather than guessing a pairing.
 *
 * Plain CommonJS with no dependencies: it is copied into the tool's folder
 * in the project and loaded by the project's own Node, or served as a plain
 * script into a browser page. It must never throw into the code it is
 * watching.
 *
 * In a browser there is no disk, so records are held and handed out by
 * `drain()` instead, the same answer the counter runtime gives: the Karma
 * client and the Playwright fixture carry them back to the driver, which
 * writes them to the same files every other runner writes. One reader
 * understands them all.
 */

 * Everything is inside one function on purpose.

 * global was then never defined, every instrumented call threw, the component
 * under test rendered nothing, and the gate reported a method the tests had
 * never reached. The run looked like a product failure and was a name
 * collision. witness-karma-client.js has been written this way from the
 * start, for the same reason.
 */

var fs;
var path;
var threadId = 0;
try {
  fs = require('node:fs');
  path = require('node:path');
  threadId = require('node:worker_threads').threadId;
} catch (e) {
  // A browser page. Nothing here needs a filesystem; see drain() below.
}

const dir = fs && env.WITNESS_BOUNDARY_DIR;
const file = dir ? path.join(dir, `boundary-${process.pid}-${threadId}.jsonl`) : undefined;

/** Records made where there is no disk, waiting for something to carry them out. */
const held = [];

/** How deep a value is walked, and how many nodes of it are visited, before it is given up on. */
const MAX_DEPTH = 20;
const MAX_NODES = 10000;

/** Per test: how many entries so far, and how deep we currently are. */
const counts = new Map();
let depth = 0;

function currentTest() {
  try {
    // The counter runtime knows which test is running wherever a runner has a
    // test boundary to hook: Node's runners, and Karma through its client. A
    // page with no such hook records null here, and whatever carries the
    // records out stamps the identity on the way past, because that is the
    // moment it is known for certain.

    return w && w.current !== undefined && w.current !== null ? w.current : null;
  } catch {
    return null;
  }

  return { t: 'uncomparable', why };
}

 * A value in the tagged, language-neutral form the comparator reads. The
 * Python recorder produces the same tags, so the comparator never learns
 * which language a record came from.
 *
 * Anything outside the comparable set is marked with the reason rather than
 * guessed at, and a value that crosses a bound is marked rather than
 * truncated: comparing a truncated value would pass two different things as
 * the same, which is the one answer this gate must never give.
 */
function capture(value, seen, budget, at) {
  if (at > MAX_DEPTH) {
    return uncomparable('depth-limit');
  }
  if (budget.n++ > MAX_NODES) {
    return uncomparable('node-limit');
  }
  if (value === null) {
    return { t: 'null' };
  }
  if (value === undefined) {
    return { t: 'undefined' };
  }
  const type = typeof value;
  if (type === 'number' || type === 'bigint') {
    return { t: 'num', v: String(value) };
  }
  if (type === 'string') {
    return { t: 'str', v: value };
  }
  if (type === 'boolean') {
    return { t: 'bool', v: value };
  }
  if (type === 'function') {
    return uncomparable('function');
  }
  if (type === 'symbol') {
    return uncomparable('symbol');
  }
  if (seen.has(value)) {
    return uncomparable('cycle');
  }
  if (value instanceof Date) {
    // An instant, which compares the same in both languages.
    return Number.isNaN(value.getTime()) ? uncomparable('invalid-date') : { t: 'date', v: value.getTime() };
  }

    // outside would add a rejection handler that was not there.

  seen.add(value);
  try {
    if (Array.isArray(value)) {
      return { t: 'array', v: value.map((item) => capture(item, seen, budget, at + 1)) };
    }
    const proto = Object.getPrototypeOf(value);
    if (proto !== Object.prototype && proto !== null) {
      return uncomparable(value.constructor && value.constructor.name ? `instance:${value.constructor.name}` : 'instance');

      out[key] = capture(value[key], seen, budget, at + 1);
    }
    return { t: 'object', v: out };
  } finally {
    seen.delete(value);
  }

function captureValue(value) {
  try {
    return capture(value, new Set(), { n: 0 }, 0);
  } catch (err) {
    return uncomparable('capture-failed');
  }
}

function captureArguments(args) {
  if (args === null || args === undefined) {
    // The instrumenter could not name the parameters, so nothing about them
    // can honestly be recorded.
    return uncomparable('unnamed-parameters');
  }
  return captureValue(Array.prototype.slice.call(args));
}

function write(record) {
  if (!file) {
    // No disk. Held for drain(), rather than dropped: a browser run that
    // silently recorded nothing would read as a method no test reached.
    held.push(record);
    return;

  try {
    fs.appendFileSync(file, `${JSON.stringify(record)}\n`);
  } catch {
    // Never fail the person's tests over an observation.

  /** A call is starting. Returns the handle the instrumented body reports to. */

    let observation;

      depth += 1;

      observation = undefined;
    }

    const finish = (kind, value) => {
      if (done || !observation) {
        return;
      }
      done = true;
      try {
        depth -= 1;
        observation.outcome = { kind, value };
        write(observation);
      } catch {
        // as above
      }
    };
    return {
      /**
       * The value is handed straight back, untouched, and captured on the
       * way past. An `async` function's return is the value its promise
       * will settle to, so it is recorded as a resolve from inside. A
       * function that is not declared async returning a promise is captured
       * like any other value, which makes it uncomparable: capture refuses
       * a thenable rather than subscribing to it.
       */
      returned(value) {
        try {
          finish(isAsync ? 'resolve' : 'return', captureValue(value));
        } catch {
          // as above
        }
        return value;
      },
      threw(error) {
        const shape = error instanceof Error ? { t: 'error', v: { name: error.constructor ? error.constructor.name : 'Error', message: String(error.message) } } : { t: 'error', v: { name: 'thrown', message: String(error) } };
        finish(isAsync ? 'reject' : 'throw', shape);
      },
      fellThrough() {
        finish(isAsync ? 'resolve' : 'return', { t: 'undefined' });
      },
    };
  },
  /**
   * The recorder could not attach at all: the named function was not found
   * in the file, or the name resolved to more than one. Recorded as a
   * record of its own so the gate reports it rather than reading an empty
   * run as a method no test reached.
   */
  problem(kind, target) {
    write({ problem: kind, target });
  },
  /**
   * Everything recorded since the last call, for a client in a browser page
   * to carry back to the driver. Empty in Node, where every record went
   * straight to disk as it was made.
   */
  drain() {
    return held.splice(0, held.length);
  },
  /** For a fixture that needs to know nothing was configured. */
  get recording() {
    return file !== undefined || !fs;
  },
};

if (!globalThis.__witnessBoundary__) {
  globalThis.__witnessBoundary__ = boundary;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = globalThis.__witnessBoundary__;
}
})();
