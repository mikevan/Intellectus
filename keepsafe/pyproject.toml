[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsafe"
version = "0.1.0"
description = "Local checkpoint-based versioning for workspace files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "KeepSafe Maintainers" }]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Operating System :: OS Independent",
	"Environment :: Console",
]

[project.scripts]
keepsafe = "keepsafe.cli:main"
ks = "keepsafe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
